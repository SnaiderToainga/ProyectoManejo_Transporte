services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transporte-uta-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - transporte_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: transporte-uta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks:
      - transporte_net

volumes:
  backend_uploads:
  backend_data:

networks:
  transporte_net:
    driver: bridge
